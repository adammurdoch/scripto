name: verify

on: [ push ]

jobs:
  linux-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup Kotlin native
        uses: actions/cache@v3
        with:
            path: |
              ~/.konan
            key: kotlin-2.4.20-konan-linux-x64
      - name: Setup tools
        uses: actions/cache@v3
        with:
            path: |
              ~/bin/downloads
            key: tools-1-linux-x64
      - name: Execute Gradle build
        run: ./gradlew build dist --continue
        timeout-minutes: 30
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup Kotlin native
        uses: actions/cache@v3
        with:
          path: |
            ~/.konan
          key: kotlin-2.4.20-konan-windows-x64
      - name: Setup tools
        uses: actions/cache@v3
        with:
          path: |
            ~/bin/downloads
          key: tools-1-windows-x64
      - name: Execute Gradle build
        run: ./gradlew compiler:build powershell:build --continue
        timeout-minutes: 60
      - name: Test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
            name: test-reports
            path: powershell/build/reports/**
  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Setup Kotlin native
        uses: actions/cache@v3
        with:
          path: |
            ~/.konan
          key: kotlin-2.4.20-konan-macos-arm64
      - name: Setup tools
        uses: actions/cache@v3
        with:
          path: |
            ~/bin/downloads
          key: tools-1-macos-arm64
      - name: Execute Gradle build
        run: ./gradlew build dist --continue
        timeout-minutes: 45
